<!DOCTYPE html>
  <head>
    <title>Todo App</title>
    <link 
      href='https://fonts.googleapis.com/css?family=Lato:300,400,700' 
      rel='stylesheet'>
    <link 
      rel='stylesheet' 
      href='style.css' 
      media='screen' 
      charset='utf-8'>
  </head>
  <body class="app">
    <section class='aaa'>
      <img class="img" src='./eisenhower-matrix.jpg'>
      <a 
        class='more_inf' 
        href='https://goal-life.com/page/method/matrix-eisenhower'>Want more details?</a>
        <h1 class="title">Eisenhower matrix</h1>
    </section>
    <main class='centered-main-page-element'>
      <section id='topSectionForAddingElementToList'>
        <label class="heading" for='new-task'>Add Item</label>
        <div class='task-row-wrapper'>
          <input 
            id='new-task'
            class='input-text task' 
            type='text'>
          <button class="button">Add</button>
        </div>
      </section>
      <section>
        <h3 class="heading">Todo</h3>
        <ul id='incompleteTasks'>
          <li class="list-item">
            <input type='checkbox' class="checkbox">
            <label class='task'>Pay Bills</label>
            <input type='text' class='input-text input-todo task'>
            <button class='button edit'>Edit</button>
            <button class='button delete'>
            <img class="delete-img" src='./remove.svg'>
            </button>
          </li>
          <li class='list-item editMode'>
            <input type='checkbox' class="checkbox">
            <label class='task'>Go Shopping</label>
            <input 
              type='text' 
              value='Go Shopping' 
              class='input-text edit-input task'>
            <button class='button edit'>Save</button>
            <button class='button delete'>
              <img class="delete-img" src='./remove.svg'>
            </button>
          </li>
        </ul>
      </section>
      <section>
        <h3 class="heading">Completed</h3>
        <ul id='completed-tasks'>
          <li class="list-item">
            <input type='checkbox' class="checkbox" checked>
            <label class='complete-label task'>See the Doctor</label>
            <input type='text' class='input-text input-todo task'>
            <button class='button edit'>Edit</button>
            <button class='button delete'>
              <img class="delete-img" src='./remove.svg'>
            </button>
          </li>
        </ul>
      </section>
    </main>
    <script src='app.js'></script>
  </body>
</html>
