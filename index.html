<!DOCTYPE html>
  <head>
    <title>Todo App</title>
    <link 
      href='https://fonts.googleapis.com/css?family=Lato:300,400,700' 
      rel='stylesheet'>
    <link 
      rel='stylesheet' 
      href='style.css' 
      media='screen' 
      charset='utf-8'>
  </head>
  <body class="app">
    <section class='info'>
      <img class="info__img" src='./eisenhower-matrix.jpg' alt="matrix">
      <a 
        class='info__link' 
        href='https://goal-life.com/page/method/matrix-eisenhower'>Want more details?</a>
        <h1 class="info__title">Eisenhower matrix</h1>
    </section>
    <main class='todos'>
      <section class="todos__add">
        <h3 class="todos__title">Add Item</h3>
        <div class='todos__row'>
          <input 
            id='create-task'
            class='todos__input todos__wrap' 
            type='text'>
          <button class="todos__button">Add</button>
        </div>
      </section>
      <section class="todos__list">
        <h3 class="todos__title">Todo</h3>
        <ul id='current-tasks'>
          <li class="todos__list-item">
            <input type='checkbox' class="todos__checkbox"/>
            <label class='todos__wrap'>Pay Bills</label>
            <input type='text' class='todos__input todos__wrap todos__wrap--hidden'/>
            <button class='todos__button todos__button--edit'>Edit</button>
            <button class='todos__button todos__button--delete'>
            <img class="todos__img" src='./remove.svg' alt="remove">
            </button>
          </li>
          <li class='todos__list-item todos__list-item--edit'>
            <input type='checkbox' class="todos__checkbox">
            <label class='todos__wrap todos__wrap--hidden'>Go Shopping</label>
            <input 
              type='text' 
              value='Go Shopping' 
              class='todos__input todos__wrap'>
            <button class='todos__button todos__button--edit'>Save</button>
            <button class='todos__button todos__button--delete'>
              <img class="todos__img" src='./remove.svg' alt="remove">
            </button>
          </li>
        </ul>
      </section>
      <section class="todo__completed">
        <h3 class="todos__title">Completed</h3>
        <ul id='completed-tasks'>
          <li class="todos__list-item">
            <input type='checkbox' class="todos__checkbox" checked>
            <label class='todos__label-completed todos__wrap'>See the Doctor</label>
            <input type='text' class='todos__input todos__wrap--hidden todos__wrap'>
            <button class='todos__button todos__button--edit'>Edit</button>
            <button class='todos__button todos__button--delete'>
              <img class="todos__img" src='./remove.svg' alt="remove">
            </button>
          </li>
        </ul>
      </section>
    </main>
    <script src='app.js'></script>
  </body>
</html>
